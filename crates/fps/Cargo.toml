[package]
name = "gpui-fps"
description = "Realtime FPS, frame time, CPU and memory HUD for GPUI applications."
keywords = ["fps", "gpui", "hud", "performance", "profiling"]
license = "Apache-2.0"
documentation = "https://docs.rs/gpui-fps"
homepage = "https://longbridge.github.io/gpui-component"
repository = "https://github.com/longbridge/gpui-component/tree/main/crates/fps"
readme = "README.md"
edition.workspace = true
publish = false
version = "0.1.0"

[lib]
doctest = false

[dependencies]
gpui.workspace = true
instant.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
sysinfo = "0.37"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
