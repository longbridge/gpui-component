[package]
description = "Behavior, interaction, and infrastructure foundations for GPUI applications."
keywords = ["desktop", "gpui", "ui", "foundation"]
license = "Apache-2.0"
name = "gpui-base"
repository = "https://github.com/longbridge/gpui-component"
homepage = "https://longbridge.github.io/gpui-component"
documentation = "https://docs.rs/gpui-base"
version = "0.5.2"
publish = false
edition.workspace = true

[lib]
doctest = false

[features]
inspector = ["gpui_macros/inspector", "gpui/inspector"]

[dependencies]
anyhow.workspace = true
aho-corasick = "1.1.3"
chrono = "0.4.38"
gpui.workspace = true
gpui_macros.workspace = true
instant.workspace = true
lsp-types.workspace = true
ropey.workspace = true
regex = "1"
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
smallvec.workspace = true
sum-tree.workspace = true
tracing.workspace = true
unicode-segmentation = "1.12.0"
web-time = "1"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
smol.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
async-channel = "2.3.1"

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle.workspace = true
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSString"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform.workspace = true
indoc = "2"
syntect.workspace = true

[lints]
workspace = true
