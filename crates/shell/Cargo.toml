[package]
name = "gpui-shell"
description = "A scriptable application runtime for GPUI, built on gpui-base."
version = "0.1.0"
keywords = ["desktop", "gpui", "javascript", "runtime"]
license = "Apache-2.0"
publish = false
edition.workspace = true
repository = "https://github.com/longbridge/gpui-component"
homepage = "https://longbridge.github.io/gpui-component"

[lib]
name = "gpui_shell"
path = "src/lib.rs"

[[bin]]
name = "gpui-shell"
path = "src/bin/gpui-shell.rs"

[features]
default = ["quickjs"]
# The scripting engine. See `src/engine/mod.rs` for the surface an engine has
# to provide; QuickJS is the only implementation today, and the feature exists
# so a second one can be added without the seam having to be invented first.
quickjs = ["dep:rquickjs"]

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
gpui-base = { workspace = true, features = ["inspector"] }

rquickjs = { version = "0.12", features = [
    "macro",
    "loader",
    "classes",
    "properties",
], optional = true }
# LLRT is still pre-release. Keep every module on the same audited revision;
# crates.io's 0.8.1-beta release uses rquickjs 0.11 and cannot share our VM.
llrt_buffer = { git = "https://github.com/awslabs/llrt", rev = "7b95c82a9b15e7ddfb2778eca4b5a63111e74f51" }
llrt_console = { git = "https://github.com/awslabs/llrt", rev = "7b95c82a9b15e7ddfb2778eca4b5a63111e74f51" }
llrt_crypto = { git = "https://github.com/awslabs/llrt", rev = "7b95c82a9b15e7ddfb2778eca4b5a63111e74f51", default-features = false, features = ["crypto-rust"] }
llrt_fs = { git = "https://github.com/awslabs/llrt", rev = "7b95c82a9b15e7ddfb2778eca4b5a63111e74f51" }
llrt_os = { git = "https://github.com/awslabs/llrt", rev = "7b95c82a9b15e7ddfb2778eca4b5a63111e74f51", default-features = false }
llrt_path = { git = "https://github.com/awslabs/llrt", rev = "7b95c82a9b15e7ddfb2778eca4b5a63111e74f51" }
llrt_process = { git = "https://github.com/awslabs/llrt", rev = "7b95c82a9b15e7ddfb2778eca4b5a63111e74f51" }
llrt_url = { git = "https://github.com/awslabs/llrt", rev = "7b95c82a9b15e7ddfb2778eca4b5a63111e74f51" }
llrt_zlib = { git = "https://github.com/awslabs/llrt", rev = "7b95c82a9b15e7ddfb2778eca4b5a63111e74f51", default-features = false, features = ["compression-rust"] }
cap-std = "4.0.3"

anyhow.workspace = true
instant.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
smallvec.workspace = true
tracing.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
