[package]
name = "gpui-kit-nsh"
version = "0.7.3"
edition = "2024"
publish = false
description = "GPUI Component bindings for NSH applications."

[features]
test-support = ["gpui-kit/test-support"]
dev = ["nsh-platform-gpui/dev"]
cli = ["dep:nsh-cli"]
speech = ["gpui-kit/speech"]

tree-sitter = ["gpui-kit/tree-sitter"]
tree-sitter-languages = ["gpui-kit/tree-sitter-languages"]
tree-sitter-astro = ["gpui-kit/tree-sitter-astro"]
tree-sitter-bash = ["gpui-kit/tree-sitter-bash"]
tree-sitter-c = ["gpui-kit/tree-sitter-c"]
tree-sitter-cmake = ["gpui-kit/tree-sitter-cmake"]
tree-sitter-cpp = ["gpui-kit/tree-sitter-cpp"]
tree-sitter-csharp = ["gpui-kit/tree-sitter-csharp"]
tree-sitter-css = ["gpui-kit/tree-sitter-css"]
tree-sitter-diff = ["gpui-kit/tree-sitter-diff"]
tree-sitter-ejs = ["gpui-kit/tree-sitter-ejs"]
tree-sitter-elixir = ["gpui-kit/tree-sitter-elixir"]
tree-sitter-erb = ["gpui-kit/tree-sitter-erb"]
tree-sitter-go = ["gpui-kit/tree-sitter-go"]
tree-sitter-graphql = ["gpui-kit/tree-sitter-graphql"]
tree-sitter-html = ["gpui-kit/tree-sitter-html"]
tree-sitter-java = ["gpui-kit/tree-sitter-java"]
tree-sitter-javascript = ["gpui-kit/tree-sitter-javascript"]
tree-sitter-jsdoc = ["gpui-kit/tree-sitter-jsdoc"]
tree-sitter-kotlin = ["gpui-kit/tree-sitter-kotlin"]
tree-sitter-lua = ["gpui-kit/tree-sitter-lua"]
tree-sitter-make = ["gpui-kit/tree-sitter-make"]
tree-sitter-markdown = ["gpui-kit/tree-sitter-markdown"]
tree-sitter-markdown-inline = ["gpui-kit/tree-sitter-markdown-inline"]
tree-sitter-php = ["gpui-kit/tree-sitter-php"]
tree-sitter-proto = ["gpui-kit/tree-sitter-proto"]
tree-sitter-python = ["gpui-kit/tree-sitter-python"]
tree-sitter-ruby = ["gpui-kit/tree-sitter-ruby"]
tree-sitter-rust = ["gpui-kit/tree-sitter-rust"]
tree-sitter-scala = ["gpui-kit/tree-sitter-scala"]
tree-sitter-sql = ["gpui-kit/tree-sitter-sql"]
tree-sitter-svelte = ["gpui-kit/tree-sitter-svelte"]
tree-sitter-swift = ["gpui-kit/tree-sitter-swift"]
tree-sitter-toml = ["gpui-kit/tree-sitter-toml"]
tree-sitter-tsx = ["gpui-kit/tree-sitter-tsx"]
tree-sitter-typescript = ["gpui-kit/tree-sitter-typescript"]
tree-sitter-yaml = ["gpui-kit/tree-sitter-yaml"]
tree-sitter-zig = ["gpui-kit/tree-sitter-zig"]

[dependencies]
gpui-kit = { path = "../kit", version = "0.7.3", features = ["gpui-fast"] }
nsh-platform-gpui = { path = "../../../nsh/crates/gpui/nsh-platform-gpui", version = "0.1.1", default-features = false, features = ["js"] }
serde_json = "1"
chrono = "0.4.38"
anyhow = "1"
futures = "0.3"
lsp-types = { version = "0.97.0", features = ["proposed"] }
serde = { version = "1", features = ["derive"] }
nsh-core = { path = "../../../nsh/crates/nsh-core", version = "0.1.1" }
nsh-cli = { path = "../../../nsh/crates/nsh-cli", version = "0.1.1", optional = true }
nsh-ui-mobile = { path = "../../../nsh/crates/nsh-ui-mobile", version = "0.1.1" }

[[bin]]
name = "gpui-kit-nsh"
path = "src/bin/gpui-kit-nsh.rs"
required-features = ["cli"]

[[bin]]
name = "nsh-gpui-host"
path = "src/bin/nsh-gpui-host.rs"
required-features = ["dev"]

[[bin]]
name = "nsh-gpui-app"
path = "src/bin/nsh-gpui-app.rs"

[lints]
workspace = true

[[example]]
name = "nsh"
path = "examples/host.rs"

[[example]]
name = "verify"
path = "examples/verify.rs"
required-features = ["test-support"]

# This adapter is a workspace of its own, like NSH's GPUI backend. Kit and its
# styled components still inherit their definitions from the parent workspace.
[workspace]
resolver = "2"
[workspace.lints.clippy]
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
dbg_macro = "deny"
let_underscore_future = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
style = { level = "allow", priority = -1 }
todo = "deny"
type_complexity = "allow"
useless_conversion = "allow"

[profile.dev]
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package]
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
smol = { opt-level = 3 }
gpui-pre = { opt-level = 3 }
gpui-fast = { opt-level = 3 }
gpui-fast-platform = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-pre-sum-tree = { opt-level = 3 }
ropey = { opt-level = 3 }
lsp-types = { opt-level = 3 }
markdown = { opt-level = 3 }
xml5ever = { opt-level = 3 }
