[package]
name = "gpui-wry"
description = "WebView support for GPUI, based on Wry."
keywords = ["webview", "gpui","wry"]
license = "Apache-2.0"
documentation = "https://docs.rs/gpui-component"
homepage = "https://longbridge.github.io/gpui-component"
repository = "https://github.com/longbridge/gpui-component/tree/main/crates/webview"
readme = "README.md"
edition.workspace = true
publish = true
version = "0.5.0"

[features]
inspector = ["wry/devtools"]

[lib]
doctest = false

[dependencies]
anyhow.workspace = true
gpui.workspace = true
wry = { git = "https://github.com/longbridge/wry", branch = "gpui-composition-controller", package = "lb-wry" }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["block2", "NSEvent", "NSView", "NSWindow"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "0.61"
