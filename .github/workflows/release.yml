name: "Release Crate"
on:
  push:
    tags:
      - "v*"
jobs:
  publish_crate:
    name: Publish Crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install system dependencies
        run: script/bootstrap
      - name: Release Crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: script/publish-crates

  # `gpui-shell` is not on crates.io (its QuickJS dependencies are git-only),
  # so it ships as a prebuilt binary on the GitHub release instead, built with
  # its default `components` feature so an installed runtime also runs
  # applications that import `gpui-component`. Asset names
  # carry no version, so `releases/latest/download/<asset>` always resolves:
  # `website/public/shell/install.sh`, Homebrew and mise all download by that name.
  gpui_shell:
    name: gpui-shell (${{ matrix.target }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            run_on: macos-latest
          - target: x86_64-apple-darwin
            run_on: macos-latest
          - target: x86_64-unknown-linux-gnu
            run_on: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            run_on: windows-latest
    runs-on: ${{ matrix.run_on }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache-save-if: false
      - name: Install system dependencies
        if: ${{ matrix.run_on != 'windows-latest' }}
        run: script/bootstrap
      - name: Build
        run: cargo build -p gpui-shell --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          name="gpui-shell-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/gpui-shell.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/gpui-shell" "dist/$name/"
          fi
          cp crates/shell/README.md LICENSE-APACHE "dist/$name/"
          cd dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a "$name.zip" "$name" > /dev/null
            sha256sum "$name.zip" > "$name.zip.sha256"
          else
            tar -czf "$name.tar.gz" "$name"
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
      - name: Upload to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/gpui-shell-*.tar.gz
            dist/gpui-shell-*.zip
            dist/gpui-shell-*.sha256
          fail_on_unmatched_files: false
