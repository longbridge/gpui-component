name: "Release Crate"
on:
  push:
    tags:
      - "v*"
jobs:
  publish_crate:
    name: Publish Crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Release Crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p gpui-component-assets
          cargo publish -p gpui-component-macros
          cargo publish -p gpui-component-base
          cargo publish -p gpui-wry

          # crates.io may take a short while to expose newly published
          # dependencies to the index used while packaging the facade crate.
          for attempt in {1..12}; do
            if cargo publish -p gpui-component; then
              exit 0
            fi
            if [ "$attempt" -eq 12 ]; then
              exit 1
            fi
            sleep 10
          done
