name: Test Docs
on:
  pull_request:
    paths:
      - "website/**"
      - "crates/base/**"
      - "crates/story-web/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.6
      - name: Install
        working-directory: website
        run: bun install
      - name: Build
        working-directory: website
        run: |
          bun run build
