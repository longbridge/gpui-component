[package]
name = "example-nsh"
description = "A GPUI Kit window embedding an NSH app that uses GPUI Base's controls."
version = "0.7.3"
publish = false
edition.workspace = true

[dependencies]
env_logger = "0.11"
gpui-kit = { path = "../../crates/kit", features = ["gpui-fast"] }
gpui-nsh = { path = "../../crates/nsh" }
# Loads the remote image of the gallery's Avatar.
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.9" }

[lints]
workspace = true
