<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="100%" role="img" aria-labelledby="t d">
  <title id="t">A price moves: how much of a panel is described again</title>
  <desc id="d">Two scenes of the same forty-row watchlist, one price moving in a single row. In the first, each row is a retained view of its own: only the row whose price changed is described again, in orange, while the other seven replay the descriptions they already published, in blue, without entering the JavaScript VM. Nine nodes are described. In the second, the whole panel is one view: the same price change re-describes every row, all in orange, and 361 nodes are described. The lever is not how complex the panel is, but how much interface sits behind a single invalidation.</desc>
  <defs>
    <style>
      text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
      .h1{fill:#18181b;font-size:15px;font-weight:650}
      .note{fill:#6b7078;font-size:11.5px}
      .scene{fill:#18181b;font-size:13px;font-weight:600}
      .caption{fill:#6b7078;font-size:11.5px}
      .key{font-size:11.5px;font-weight:600}
      .key-js{fill:#ea580c}
      .key-native{fill:#2563eb}
      .frame{fill:none;stroke:rgba(20,20,22,.16);stroke-width:1}
      .slot{fill:rgba(20,20,22,.09)}
      .cell{fill:rgba(20,20,22,.16);opacity:.9}
      .describe{fill:#ea580c;opacity:.10;animation:describe 4s linear infinite}
      .replay{fill:#2563eb;opacity:.10;animation:replay 4s linear infinite}
      .tick{fill:#ea580c;animation:tick 4s linear infinite}
      @keyframes describe{0%,7%{opacity:.10}11%,38%{opacity:.92}50%,100%{opacity:.10}}
      @keyframes replay{0%,7%{opacity:.10}11%,38%{opacity:.34}50%,100%{opacity:.10}}
      @keyframes tick{0%,3%{opacity:.22}6%,20%{opacity:1}32%,100%{opacity:.22}}
      @media (prefers-reduced-motion: reduce){
        .describe{animation:none;opacity:.92}
        .replay{animation:none;opacity:.34}
        .tick{animation:none;opacity:1}
      }
    </style>
  </defs>

  <text class="h1" x="24" y="28">One price moves. How much is described again?</text>
  <text class="note" x="24" y="48">The outline is the invalidation boundary: a tick re-describes everything inside the one it lands in.</text>

  <circle class="tick" cx="28" cy="74" r="4"/>
  <text class="key key-js" x="40" y="78">describes again — the script runs</text>
  <circle class="key-native" cx="284" cy="74" r="4"/>
  <text class="key key-native" x="296" y="78">replays its snapshot — no JavaScript</text>

