<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" role="img" aria-labelledby="t d">
  <title id="t">One process, one thread for the VM, and four places memory lives</title>
  <desc id="d">The host process contains a main thread and background workers. On the main thread the QuickJS VM, the snapshot it produces and GPUI's App sit in a row: a notify runs render once and fills the snapshot across a plain FFI call, and every frame after that replays the snapshot without re-entering the VM. Background workers handle timers and blocking I/O, then settle on the foreground executor without touching the VM. Memory splits four ways: the JavaScript heap capped at 256 MiB and freed by its own GC; the description arena owned by the snapshot that produced it, of which a view keeps two; the callback arena keyed by snapshot generation and retired with it; and GPUI's frame arena, which lasts exactly one draw.</desc>
  <defs>
    <style>
      text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;font-size:11px}
      .h1{fill:#e9e9ec;font-size:15px;font-weight:650}
      .h2{font-size:12.5px;font-weight:650}
      .lbl{fill:#e9e9ec;font-size:12.5px;font-weight:600}
      .note{fill:#9ca0a8;font-size:11px}
      .tag{fill:#9ca0a8;font-size:10px;letter-spacing:.07em}
      .band{fill:rgba(255,255,255,.045);stroke:rgba(255,255,255,.13)}
      .card{fill:rgba(255,255,255,.07);stroke:rgba(255,255,255,.20)}
      .rust{fill:#7daaff}
      .js{fill:#fb923c}
      .flow{stroke:rgba(255,255,255,.48);stroke-width:1.4;fill:none}
      .dash{stroke:rgba(255,255,255,.48);stroke-width:1.2;fill:none;stroke-dasharray:4 4;opacity:.6}
      .dot-js{fill:#fb923c;animation:describe 4s ease-in-out infinite}
      .dot-rust{fill:#7daaff;animation:replay 1.1s linear infinite}
      .dot-timer{fill:#9ca0a8;animation:resolve 4s ease-in-out infinite}
      @keyframes describe{
        0%{opacity:0;transform:translate(0,0)}
        8%{opacity:1;transform:translate(0,0)}
        28%{opacity:1;transform:translate(104px,0)}
        36%,100%{opacity:0;transform:translate(104px,0)}
      }
      @keyframes replay{
        0%{opacity:0;transform:translate(0,0)}
        12%{opacity:1}
        88%{opacity:1;transform:translate(66px,0)}
        100%{opacity:0;transform:translate(66px,0)}
      }
      @keyframes resolve{
        0%,58%{opacity:0;transform:translate(0,0)}
        63%{opacity:1;transform:translate(0,0)}
        82%{opacity:1;transform:translate(0,-94px)}
        90%,100%{opacity:0;transform:translate(0,-94px)}
      }
      @media (prefers-reduced-motion: reduce){
        .dot-js,.dot-rust,.dot-timer{animation:none;opacity:.9}
      }
    </style>
  </defs>

  <text class="h1" x="16" y="22">The host process</text>

  <rect class="band" x="16" y="36" width="848" height="170" rx="10"/>
  <text class="tag" x="30" y="56">MAIN THREAD</text>

  <rect class="card" x="30" y="68" width="190" height="94" rx="8"/>
  <text class="lbl js" x="46" y="92">QuickJS VM</text>
  <text class="note" x="46" y="112">render() describes;</text>
  <text class="note" x="46" y="128">handlers and tasks run here</text>
  <text class="note mono" x="46" y="150">Rc · !Send · !Sync</text>

  <path class="flow" d="M220 108 H340"/>
  <circle class="dot-js" cx="226" cy="108" r="4.5"/>
  <text class="tag" x="252" y="98">FFI</text>
  <text class="note js" x="240" y="128">one render</text>

  <rect class="card" x="340" y="68" width="170" height="94" rx="8"/>
  <text class="lbl" x="356" y="92">Snapshot</text>
  <text class="note" x="356" y="112">the finished description,</text>
  <text class="note" x="356" y="128">frozen until the next notify</text>

  <path class="flow" d="M510 108 H600"/>
  <circle class="dot-rust" cx="516" cy="108" r="4.5"/>
  <text class="note rust" x="524" y="128">every frame</text>

  <rect class="card" x="600" y="68" width="248" height="94" rx="8"/>
  <text class="lbl rust" x="616" y="92">GPUI App</text>
  <text class="note" x="616" y="112">replays the snapshot, lays out, paints</text>
  <text class="note" x="616" y="128">60 frames a second, no JavaScript</text>

  <text class="note" x="30" y="192">cx.notify() runs render once and fills the snapshot; every frame after that replays it in Rust.</text>

  <rect class="band" x="16" y="216" width="848" height="66" rx="10"/>
  <text class="tag" x="30" y="236">BACKGROUND THREAD</text>
  <rect class="card" x="30" y="244" width="118" height="30" rx="6"/>
  <text class="note" x="89" y="263" text-anchor="middle">timers + blocking I/O</text>
  <path class="dash" d="M89 244 V162"/>
  <circle class="dot-timer" cx="89" cy="242" r="4"/>
  <text class="note" x="168" y="263">timers and blocking I/O run here; results settle back on the main thread without touching the VM</text>

  <text class="h1" x="16" y="306">Where memory lives</text>

  <rect class="card" x="16" y="322" width="204" height="130" rx="8"/>
  <text class="h2 js" x="32" y="346">JavaScript heap</text>
  <text class="note" x="32" y="368">objects, closures,</text>
  <text class="note" x="32" y="384">module scope</text>
  <text class="note mono" x="32" y="408">cap 256 MiB</text>
  <text class="note" x="32" y="432">freed by its own GC</text>

  <rect class="card" x="230" y="322" width="204" height="130" rx="8"/>
  <text class="h2 rust" x="246" y="346">description arena</text>
  <text class="note" x="246" y="368">what render() recorded,</text>
  <text class="note" x="246" y="384">owned by its snapshot</text>
  <text class="note" x="246" y="408">a view keeps two:</text>
  <text class="note" x="246" y="424">current and previous</text>

  <rect class="card" x="444" y="322" width="204" height="130" rx="8"/>
  <text class="h2 rust" x="460" y="346">callback arena</text>
  <text class="note" x="460" y="368">handlers registered</text>
  <text class="note" x="460" y="384">during that render,</text>
  <text class="note" x="460" y="408">keyed by generation and</text>
  <text class="note" x="460" y="424">retired with the snapshot</text>

  <rect class="card" x="658" y="322" width="206" height="130" rx="8"/>
  <text class="h2 rust" x="674" y="346">GPUI frame arena</text>
  <text class="note" x="674" y="368">the real elements,</text>
  <text class="note" x="674" y="384">built by materialize</text>
  <text class="note" x="674" y="408">lives exactly one draw</text>

  <text class="note" x="16" y="478">Nothing crossing the boundary is an object: an element handle is an index, retained state is a GPUI entity handle, and every argument and result is plain data.</text>
</svg>
